# render.yaml — GuidePaw Render Blueprint
# Add to repo root, push, then in Render: New → Blueprint → connect jphutching/GuidePaw
#
# Known Render URLs:
#   Main app:   https://guidepaw-ch3y.onrender.com
#   Middleware: https://guidepaw-middleware-kfzu.onrender.com

services:
  # ── Main GuidePaw App ─────────────────────────────────────────────────────
  - type: web
    name: guidepaw
    runtime: docker
    plan: starter
    branch: main
    envVars:
      - key: APP_URL
        value: https://guidepaw.app

  # ── AI Middleware ─────────────────────────────────────────────────────────
  - type: web
    name: guidepaw-middleware
    runtime: node
    plan: starter
    branch: main
    rootDir: middleware
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "20"                  # pins to Node 20 LTS — fixes better-sqlite3 compile error
      - key: NODE_ENV
        value: production
      - key: MIDDLEWARE_SECRET
        sync: false
      - key: MIDDLEWARE_URL
        value: https://guidepaw-middleware-kfzu.onrender.com
      - key: REPO_PATH
        value: /opt/render/project/src
      - key: DB_PATH
        value: /tmp/guidepaw-sessions.db
      - key: RENDER_APP_URL
        value: https://guidepaw-ch3y.onrender.com
      - key: RENDER_MIDDLEWARE_URL
        value: https://guidepaw-middleware-kfzu.onrender.com
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_NAME
        value: guidepaw
      - key: RENDER_DEPLOY_HOOK
        sync: false
      - key: GITHUB_DEPLOY_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_TIMEOUT_MINUTES
        value: "45"
      - key: TOKEN_WARNING_THRESHOLD
        value: "15000"
