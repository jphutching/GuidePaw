# GuidePaw Render Blueprint
# Put this file at the root of the GitHub repo:
# /home/james/projects/gpb3/gpb3/render.yaml

version: "1"

projects:
  - name: GuidePaw
    environments:
      - name: Beta
        services:
          - type: web
            name: GuidePaw
            runtime: docker
            repo: https://github.com/jphutching/GuidePaw
            branch: main
            plan: free
            region: oregon
            dockerContext: .
            dockerfilePath: ./Dockerfile
            autoDeployTrigger: commit
            domains:
              - beta.guidepaw.app
            envVars:
              - key: APP_ENV
                value: production

              - key: APP_DEBUG
                value: "false"

              - key: APP_URL
                value: https://beta.guidepaw.app

              - key: DB_CONNECTION
                value: pgsql

              - key: DB_DRIVER
                value: pgsql

              - key: DB_HOST
                fromDatabase:
                  name: guidepaw_db
                  property: host

              - key: DB_PORT
                value: "5432"

              - key: DB_DATABASE
                fromDatabase:
                  name: guidepaw_db
                  property: database

              - key: DB_NAME
                fromDatabase:
                  name: guidepaw_db
                  property: database

              - key: DB_USERNAME
                fromDatabase:
                  name: guidepaw_db
                  property: user

              - key: DB_USER
                fromDatabase:
                  name: guidepaw_db
                  property: user

              - key: DB_PASSWORD
                fromDatabase:
                  name: guidepaw_db
                  property: password

              - key: DATABASE_URL
                fromDatabase:
                  name: guidepaw_db
                  property: connectionString

              - key: SESSION_SECRET
                generateValue: true

              - key: ADMIN_EMAIL
                value: admin@guidepaw.app

              - key: ADMIN_NOTIFY_EMAIL
                value: admin@guidepaw.app

              - key: BETA_NOTIFY_EMAIL_ENABLED
                value: "true"

        databases:
          - name: guidepaw_db
            databaseName: guidepaw_db_z9vv
            user: guidepaw
            plan: basic-256mb
            region: oregon
            postgresMajorVersion: "18"
            diskSizeGB: 15
            ipAllowList:
              - source: 0.0.0.0/0
                description: everywhere
