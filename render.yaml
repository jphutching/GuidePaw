# render.yaml — GuidePaw Render Blueprint
# Add to repo root, push, then in Render: New → Blueprint → connect jphutching/GuidePaw
#
# Known Render URLs:
#   Main app:   https://guidepaw.onrender.com
#   Middleware: https://guidepaw-middleware.onrender.com  (confirm slug after deploy)

services:

  # ── Main GuidePaw App ─────────────────────────────────────────────────────
  # Adjust buildCommand/startCommand to match your actual stack
  - type: web
    name: guidepaw
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # ── AI Middleware ─────────────────────────────────────────────────────────
  - type: web
    name: guidepaw-middleware
    runtime: node
    plan: free
    branch: main
    rootDir: middleware
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MIDDLEWARE_SECRET
        sync: false
      - key: MIDDLEWARE_URL
        value: https://guidepaw-middleware.onrender.com
      - key: REPO_PATH
        value: /opt/render/project/src
      - key: DB_PATH
        value: /tmp/guidepaw-sessions.db
      - key: RENDER_APP_URL
        value: https://guidepaw.onrender.com
      - key: RENDER_MIDDLEWARE_URL
        value: https://guidepaw-middleware.onrender.com
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_NAME
        value: guidepaw
      - key: RENDER_DEPLOY_HOOK
        sync: false
      - key: GITHUB_DEPLOY_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_TIMEOUT_MINUTES
        value: "45"
      - key: TOKEN_WARNING_THRESHOLD
        value: "15000"
