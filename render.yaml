# render.yaml — GuidePaw Render Blueprint
# Add to repo root, push, then in Render: New → Blueprint → connect jphutching/GuidePaw
#
# Known Render URLs:
#   Main app:   https://guidepaw-ch3y.onrender.com
#   Middleware: https://guidepaw-middleware-kfzu.onrender.com

services:
  # ── Main GuidePaw App ─────────────────────────────────────────────────────
  - type: web
    name: guidepaw
    runtime: docker
    plan: starter
    branch: main
    envVars:
      - key: APP_URL
        value: https://guidepaw.app
      - key: APP_ENV
        value: production
      # DATABASE_URL auto-injected from the linked Render PostgreSQL service.
      # db_connect.php parses DATABASE_URL first; falls back to individual DB_* vars.
      - key: DATABASE_URL
        fromDatabase:
          name: guidepaw_db
          property: connectionString
      # Keep individual vars as sync:false fallback (set manually in Render dashboard if needed)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DRIVER
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: SMS_NOTIFY_ENABLED
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: FOUND_DOG_NOTIFY_SMS_ENABLED
        sync: false
      - key: DOG_ACCESS_NOTIFY_SMS_ENABLED
        sync: false
      - key: FOUND_DOG_NOTIFY_EMAIL_ENABLED
        sync: false
      - key: FOUND_DOG_NOTIFY_TELEGRAM_ENABLED
        sync: false
      - key: BETA_NOTIFY_TELEGRAM_ENABLED
        sync: false
      - key: BETA_NOTIFY_EMAIL_ENABLED
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GUIDEPAW_STRIPE_API_VERSION
        sync: false
      - key: GUIDEPAW_STRIPE_SECRET_KEY
        sync: false
      - key: GUIDEPAW_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ZEPTO_SEND_MAIL_TOKEN
        sync: false
      # Companion version — update these when bumping the Android app version
      - key: GUIDEPAW_COMPANION_VERSION_CODE
        value: "59"
      - key: GUIDEPAW_COMPANION_VERSION_NAME
        value: "0.059"

  # ── AI Middleware ─────────────────────────────────────────────────────────
  - type: web
    name: guidepaw-middleware
    runtime: node
    plan: starter
    branch: main
    rootDir: middleware
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: MIDDLEWARE_SECRET
        sync: false
      - key: MIDDLEWARE_URL
        value: https://guidepaw-middleware-kfzu.onrender.com
      - key: REPO_PATH
        value: /opt/render/project/src
      - key: DB_PATH
        value: /tmp/guidepaw-sessions.db
      - key: RENDER_APP_URL
        value: https://guidepaw-ch3y.onrender.com
      - key: RENDER_MIDDLEWARE_URL
        value: https://guidepaw-middleware-kfzu.onrender.com
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_NAME
        value: guidepaw
      - key: RENDER_DEPLOY_HOOK
        sync: false
      - key: GITHUB_DEPLOY_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_TIMEOUT_MINUTES
        value: "45"
      - key: TOKEN_WARNING_THRESHOLD
        value: "15000"
